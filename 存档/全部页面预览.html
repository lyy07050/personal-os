<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人生 OS 页面预览</title>
<style>
:root{
  --bg:#f6f4f0; --panel:#fff; --side:#efece6; --ink:#2b2a28; --muted:#8a857c; --line:#e4dfd6;
  --accent:#c2683f; --accent-soft:#f4e3d9; --green:#5b8c6a; --green-soft:#e3eee5;
  --g1:#dfeadf; --g2:#b4d1b9; --g3:#7fae89; --g4:#4f8a5e;
  --bar:#ece7df; --warn:#c9483b; --warn-soft:#f7e0dd; --blue:#4a7bb0; --blue-soft:#e1ebf5; --purple:#8a63b0;
  --frame:#1d1c1a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1e1d1b; --panel:#272523; --side:#22201e; --ink:#ece8e1; --muted:#9a948a; --line:#3a3733;
    --accent:#e08a5f; --accent-soft:#3d2d24; --green:#86b892; --green-soft:#2a3a2e;
    --g1:#2c3a2f; --g2:#3f5c46; --g3:#5e8a68; --g4:#86b892;
    --bar:#34312d; --warn:#e26b5e; --warn-soft:#432a27; --blue:#7fa8d6; --blue-soft:#25313d; --purple:#b393d6;
    --frame:#000;
  }
}
:root[data-theme="dark"]{
  --bg:#1e1d1b; --panel:#272523; --side:#22201e; --ink:#ece8e1; --muted:#9a948a; --line:#3a3733;
  --accent:#e08a5f; --accent-soft:#3d2d24; --green:#86b892; --green-soft:#2a3a2e;
  --g1:#2c3a2f; --g2:#3f5c46; --g3:#5e8a68; --g4:#86b892;
  --bar:#34312d; --warn:#e26b5e; --warn-soft:#432a27; --blue:#7fa8d6; --blue-soft:#25313d; --purple:#b393d6;
  --frame:#000;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif}
button{font:inherit;color:inherit}
/* top switcher */
.topbar{position:sticky;top:0;z-index:20;display:flex;gap:8px;align-items:center;justify-content:center;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line);flex-wrap:wrap}
.seg{display:inline-flex;background:var(--bar);border-radius:999px;padding:3px}
.seg button{border:none;background:transparent;padding:6px 16px;border-radius:999px;cursor:pointer;font-size:14px}
.seg button.on{background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.ghost{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
.hint{font-size:12px;color:var(--muted);width:100%;text-align:center}

/* ===== desktop ===== */
.desk{display:flex;min-height:calc(100vh - 58px)}
.side{width:220px;background:var(--side);border-right:1px solid var(--line);padding:14px 10px;font-size:14px;flex-shrink:0}
.side h4{margin:6px 10px 6px;font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.06em}
.side a{display:flex;gap:8px;align-items:center;padding:6px 10px;border-radius:7px;color:var(--ink);text-decoration:none;cursor:pointer;margin:1px 0}
.side a:hover{background:var(--bar)}
.side a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side a .cnt{margin-left:auto;font-size:11px;background:var(--accent);color:#fff;border-radius:99px;padding:0 6px}
.side a.lock{color:var(--muted)}
.dmain{flex:1;min-width:0;padding:28px 32px 60px;max-width:1120px}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.ph h1{margin:0;font-size:25px}
.ph .sub{color:var(--muted);font-size:14px;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.wide{grid-column:1/-1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;min-width:0}
.card h3{margin:0 0 12px;font-size:15px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h3 small{color:var(--muted);font-weight:400;font-size:12.5px}
.stat .k{font-size:12.5px;color:var(--muted)}
.stat .v{font-size:26px;font-weight:700;letter-spacing:-.01em}
.stat .d{font-size:12.5px;color:var(--green);font-weight:600}
.stat .d.bad{color:var(--warn)}
.pill{display:inline-block;background:var(--accent-soft);color:var(--accent);padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600;border:none;cursor:pointer}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
.tag{font-size:11.5px;color:var(--muted);background:var(--bar);padding:1px 8px;border-radius:999px;white-space:nowrap}
.tag.warn{background:var(--warn-soft);color:var(--warn);font-weight:600}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.tag.blue{background:var(--blue-soft);color:var(--blue)}
.tag.green{background:var(--green-soft);color:var(--green)}
.muted{color:var(--muted)}
.small{font-size:13px}
.todo{list-style:none;margin:0;padding:0}
.todo li{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);cursor:pointer;user-select:none}
.todo li:last-child{border-bottom:none}
.box{width:18px;height:18px;border:1.5px solid var(--muted);border-radius:5px;flex-shrink:0;display:grid;place-items:center;font-size:12px;color:#fff}
.todo li.done .box{background:var(--green);border-color:var(--green)}
.todo li.done .t{text-decoration:line-through;color:var(--muted)}
.todo .tag{margin-left:auto}
.row{display:grid;grid-template-columns:56px 1fr 62px;gap:10px;align-items:center;font-size:13.5px;margin:8px 0}
.track{height:8px;background:var(--bar);border-radius:99px;overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:99px}
.fill.g{background:var(--green)}
.v{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.bars{display:flex;gap:6px;align-items:flex-end;height:90px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);justify-content:flex-end;height:100%}
.bars i{display:block;width:100%;background:var(--accent);opacity:.7;border-radius:4px 4px 2px 2px}
.bars .cur i{opacity:1}
.proj{margin:12px 0}
.proj .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:3px;overflow-x:auto;padding-bottom:2px}
.heat i{width:13px;height:13px;border-radius:3px;background:var(--bar)}
.heat i.l1{background:var(--g1)}.heat i.l2{background:var(--g2)}.heat i.l3{background:var(--g3)}.heat i.l4{background:var(--g4)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{border:1px solid var(--line);background:transparent;padding:4px 12px;border-radius:999px;font-size:13px;cursor:pointer}
.chips button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--muted);font-weight:500;font-size:12.5px;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.donut{width:150px;height:150px;border-radius:50%;position:relative;flex-shrink:0}
.donut::after{content:"";position:absolute;inset:26px;background:var(--panel);border-radius:50%}
.donut span{position:absolute;inset:0;display:grid;place-items:center;z-index:1;font-weight:700;font-size:18px;text-align:center;line-height:1.2}
.donut span small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.legend{display:flex;flex-direction:column;gap:6px;font-size:13px}
.legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item .img{height:96px;display:grid;place-items:center;font-size:42px;background:var(--bar)}
.item .b{padding:9px 11px}
.item .n{font-weight:600;font-size:14px}
.item .m{font-size:12px;color:var(--muted)}
.foodrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.foodrow:last-child{border-bottom:none}
.ai{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:13.5px}
.ai b{color:var(--accent)}
.kcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;border-left:3px solid var(--accent)}
.kcard .t{font-weight:600;margin:4px 0}
.kcard .n{font-size:13px;color:var(--muted)}
.search{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 12px;font:inherit;color:var(--ink);margin-bottom:12px}
.flash{border:1px solid var(--line);border-radius:16px;background:var(--panel);min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;cursor:pointer;user-select:none}
.flash .p{font-size:26px;font-weight:700}
.flash .c{font-size:15px;margin-top:8px}
.flash .e{font-size:13px;color:var(--muted);margin-top:8px;font-style:italic}
.rate{display:flex;gap:8px;justify-content:center;margin-top:12px}
.rate button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 16px;cursor:pointer;font-size:13.5px}
.inbox-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.inbox-item:last-child{border-bottom:none}
.inbox-item .body{flex:1;min-width:0}
.inbox-item .when{font-size:12px;color:var(--muted)}
.lockbox{border:1px dashed var(--line);border-radius:14px;padding:26px;text-align:center}
.lockbox input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font:inherit;color:var(--ink);margin:10px 0;width:200px;max-width:100%}
.pipe{display:flex;gap:6px;align-items:stretch}
.pipe div{flex:1;background:var(--bar);border-radius:10px;padding:10px;text-align:center}
.pipe b{display:block;font-size:22px}
.pipe span{font-size:12px;color:var(--muted)}
.banner{background:var(--blue-soft);color:var(--blue);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:14px}
.q{font-size:14px;margin:10px 0 4px;font-weight:600}
.qa{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--muted);min-height:44px}
.spark{width:100%;height:80px}

/* ===== mobile ===== */
.mwrap{display:flex;justify-content:center;padding:24px 16px 40px}
.phone{width:390px;max-width:100%;height:800px;max-height:calc(100vh - 110px);min-height:560px;border:10px solid var(--frame);border-radius:46px;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.18)}
.status{height:40px;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-size:13px;font-weight:600;flex-shrink:0}
.mscroll{flex:1;overflow-y:auto;padding:4px 16px 90px}
.mh{font-size:24px;font-weight:700;margin:6px 0 2px}
.msub{color:var(--muted);font-size:13px;margin-bottom:14px}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.mcard h4{margin:0 0 8px;font-size:14px;display:flex;justify-content:space-between}
.mcard h4 small{color:var(--muted);font-weight:400}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:78px;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-start;padding-top:8px}
.tabbar button{border:none;background:transparent;display:flex;flex-direction:column;align-items:center;font-size:10.5px;color:var(--muted);cursor:pointer;gap:2px;width:60px}
.tabbar button .i{font-size:21px;line-height:1}
.tabbar button.on{color:var(--accent);font-weight:600}
.tabbar .plus .i{width:48px;height:48px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:28px;margin-top:-18px;box-shadow:0 6px 16px rgba(194,104,63,.4)}
.sheet{position:absolute;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;z-index:5}
.sheet.show{display:flex}
.sheet .in{background:var(--panel);width:100%;border-radius:22px 22px 0 0;padding:18px 16px 30px}
.sheet .grab{width:40px;height:5px;background:var(--line);border-radius:9px;margin:0 auto 14px}
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.qgrid button{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px}
.qgrid button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.qgrid .i{font-size:22px}
.minput{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font:inherit;color:var(--ink)}
.mbtn{width:100%;margin-top:10px;border:none;background:var(--accent);color:#fff;border-radius:12px;padding:11px;font-weight:600;cursor:pointer}
.toast{position:absolute;top:50px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:99px;font-size:13px;z-index:9;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.mlist{list-style:none;margin:0;padding:0}
.mlist li{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;gap:8px}
.mlist li:last-child{border-bottom:none}
.menu a{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:15px}
.menu a:last-child{border-bottom:none}
.menu a::after{content:"›";margin-left:auto;color:var(--muted);font-size:20px}
.back{border:none;background:none;color:var(--accent);cursor:pointer;padding:4px 0;font-size:14px}

/* week calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .day{border-radius:9px;padding:6px 4px;min-height:150px;background:var(--bg)}
.cal .day.today{background:var(--accent-soft);outline:1.5px solid var(--accent)}
.cal .dh{text-align:center;font-size:11.5px;color:var(--muted);margin-bottom:5px;line-height:1.3}
.cal .dh b{display:block;font-size:14px;color:var(--ink)}
.cal .today .dh b{color:var(--accent)}
.ev{font-size:11px;line-height:1.3;border-radius:5px;padding:3px 4px;margin-bottom:3px;background:var(--panel);border-left:3px solid var(--muted);overflow:hidden}
.ev span{display:block;color:var(--muted);font-size:10px}
.ev.class{border-left-color:var(--blue)}.ev.ddl{border-left-color:var(--warn)}.ev.job{border-left-color:var(--purple)}.ev.life{border-left-color:var(--green)}
.calkey{display:flex;gap:10px;font-size:11.5px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.calkey i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
/* sidebar sub-items */
.side a.parent{font-weight:600}
.side a.parent::after{content:"▾";margin-left:auto;color:var(--muted);font-size:11px}
.side a.sub{padding-left:30px;font-size:13.5px}
/* journal */
.jentry{padding:10px 0;border-bottom:1px dashed var(--line)}
.jentry:last-child{border-bottom:none}
.jentry .when{font-size:11.5px;color:var(--muted)}
.jentry .txt{font-size:14px;margin-top:2px}
.jinput{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;font:inherit;color:var(--ink);resize:none;min-height:60px}
/* courses */
.course{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;border-top:3px solid var(--blue);cursor:pointer}
.course.on{outline:2px solid var(--blue)}
.course .code{font-size:12px;color:var(--blue);font-weight:700}
.course .n{font-weight:600;margin:2px 0 6px}
@media (max-width:900px){
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:1100px){
  .cal .day{min-height:120px}
  .ev span{display:none}
}
@media (max-width:760px){
  .side{display:none}
  .dmain{padding:18px 16px 50px}
  .grid,.g3{grid-template-columns:1fr}
  .dnav{display:flex!important}
}
.dnav{display:none;gap:6px;overflow-x:auto;padding:10px 16px 0}
.dnav button{white-space:nowrap;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer}
.dnav button.on{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:600}
</style>
</head>
<body>
<div class="topbar">
  <div class="seg" id="modeSeg">
    <button data-m="desk" class="on">💻 电脑版</button>
    <button data-m="mob">📱 手机版</button>
  </div>
  <button class="ghost" id="themeBtn">🌓 深浅色</button>
  <div class="hint" id="hint"></div>
</div>
<div id="app"></div>

  const t=e.target.closest('[data-go],[data-mgo],[data-todo],[data-heat],[data-filter],[data-course],[data-mday],[data-kfilter],[data-flip],[data-rate],[data-unlock],[data-cap],[data-captype],[data-save],[data-ai],#sheet,#modeSeg button');
  if(!t)return;
  if(t.matches('#modeSeg button')){state.mode=t.dataset.m;try{localStorage.setItem('los-mode',state.mode)}catch(_){};render();window.scrollTo(0,0);return}
  if(t.dataset.go){state.page=t.dataset.go;render();window.scrollTo(0,0);return}
  if(t.dataset.mgo){state.mpage=t.dataset.mgo;render();return}
  if(t.dataset.todo!==undefined){const i=+t.dataset.todo;S.todos[i][2]=!S.todos[i][2];render();return}
  if(t.dataset.heat!==undefined){state.heatH=+t.dataset.heat;render();return}
  if(t.dataset.filter){state.filter=t.dataset.filter;render();return}
  if(t.dataset.course!==undefined){state.course=+t.dataset.course;render();return}
  if(t.dataset.mday!==undefined){state.mday=+t.dataset.mday;render();return}
  if(t.dataset.kfilter){state.kfilter=t.dataset.kfilter;render();return}
  if(t.dataset.flip){state.flip=!state.flip;render();return}
  if(t.hasAttribute('data-rate')){state.fi=Math.min(state.fi+1,11);state.flip=false;render();return}
  if(t.hasAttribute('data-unlock')){state.unlocked=true;render();return}
  if(t.hasAttribute('data-ai')){alert('预览：真实版本里，这一步是你对 Claude 说一句话，由 AI 完成整理。');return}
  if(t.hasAttribute('data-cap')){document.getElementById('sheet').classList.add('show');return}
  if(t.dataset.captype!==undefined){state.capType=+t.dataset.captype;render();document.getElementById('sheet').classList.add('show');return}
  if(t.hasAttribute('data-save')){const v=(document.getElementById('capIn').value||'').trim()||CAP[state.capType][2].replace('比如：','');
    if(state.capType===0){const m=v.match(/(.+?)\s*(\d+(?:\.\d+)?)/);if(m){S.txns.unshift(['今天',m[1].trim(),+m[2],/奶茶|咖啡|茶|外卖|饭/.test(m[1])?'餐饮':/衣|裤|鞋/.test(m[1])?'服饰':'待分类','手动'])}}
    else S.inbox.unshift(['刚刚',CAP[state.capType][0],v,CAP[state.capType][1]]);
    render();toast('✓ 已记到「'+CAP[state.capType][1]+'」');return}
  if(t.id==='sheet'&&e.target.id==='sheet'){t.classList.remove('show')}
});
document.getElementById('themeBtn').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark'};
render();
</script>
