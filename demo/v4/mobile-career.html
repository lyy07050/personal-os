<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>my little os. · 人事部</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="mobile.css?v=6">
<style>
.iv{background:var(--pink);margin-bottom:12px;padding:18px}
.iv b{display:block;font-size:22px;font-weight:600;letter-spacing:-.02em;margin:12px 0 4px}
.iv p{font-size:13.5px;color:var(--ink-2)}
.prep{list-style:none}
.prep li{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:14.5px;border-bottom:1px solid rgba(37,45,41,.06)}
.prep li:last-child{border-bottom:0}
.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.s{padding:12px 8px;text-align:center;border-radius:20px}
.s .num{display:block;font-size:24px;color:var(--green)}
.s span{font-size:12.5px;color:var(--ink-2)}
.jobsync{display:flex;align-items:center;justify-content:center;height:48px;margin-top:12px;border-radius:999px;background:#fff;box-shadow:var(--shadow);font-size:15px;font-weight:500}
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="screen">
      <div class="island"></div>
      <div class="scroll">
        <div class="status"><span>9:41</span><svg width="74" height="14" viewBox="0 0 74 14" aria-hidden="true"><g fill="#252d29"><rect x="0" y="9" width="3" height="5" rx="1"/><rect x="5" y="6" width="3" height="8" rx="1"/><rect x="10" y="3" width="3" height="11" rx="1"/><rect x="15" y="0" width="3" height="14" rx="1"/><path d="M32 3.5a10 10 0 0 1 13 0l-1.6 1.7a7.6 7.6 0 0 0-9.8 0zM34.6 6.3a6.2 6.2 0 0 1 7.8 0l-1.6 1.7a3.8 3.8 0 0 0-4.6 0zM38.5 12.5l-2-2.1a2.6 2.6 0 0 1 4 0z"/><rect x="50" y="1" width="21" height="12" rx="3.5" fill="none" stroke="#252d29" stroke-opacity=".4"/><rect x="52" y="3" width="17" height="8" rx="2"/></g></svg></div>
        <header class="navbar"><a class="round" href="mobile-more.html" aria-label="返回所有部门"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M11 3 5 9l6 6" fill="none" stroke="#252d29" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></a><div class="title"><h1 class="h">人事部</h1><p>投递 14 · 面试中 2</p></div></header>

        <section class="card iv" aria-label="下一场面试"><span class="chip warn">周五 15:00</span><b>Manulife · 二面</b><p>Data Analyst Intern · 视频</p></section>
        <section class="card" aria-label="面试准备"><div class="label"><span>面试准备</span></div><ul class="prep">
          <li class="done"><button class="ck" aria-label="完成"><svg width="11" height="9" viewBox="0 0 11 9"><path d="M1 4.6 4 7.5 10 1.5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><span class="t">复习简历上的 3 个项目</span></li>
          <li><button class="ck" aria-label="完成"><svg width="11" height="9" viewBox="0 0 11 9"><path d="M1 4.6 4 7.5 10 1.5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><span class="t">准备 2 个 STAR 故事</span></li>
          <li><button class="ck" aria-label="完成"><svg width="11" height="9" viewBox="0 0 11 9"><path d="M1 4.6 4 7.5 10 1.5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><span class="t">SQL 窗口函数再练 5 题</span></li>
          <li><button class="ck" aria-label="完成"><svg width="11" height="9" viewBox="0 0 11 9"><path d="M1 4.6 4 7.5 10 1.5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><span class="t">想好 3 个反问问题</span></li></ul></section>
        <div class="stages">
          <div class="card s" style="background:var(--tint)"><b class="num">5</b><span>想投</span></div>
          <div class="card s" style="background:var(--sage)"><b class="num">7</b><span>已投递</span></div>
          <div class="card s" style="background:var(--pink)"><b class="num">2</b><span>面试中</span></div>
          <div class="card s" style="background:var(--yellow)"><b class="num">0</b><span>Offer</span></div>
        </div>
        <a class="jobsync" href="#">打开 JobSync</a>
      </div>
      <div class="dock"><label class="search"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6.2" fill="none" stroke="#252d29" stroke-width="1.7"/><path d="m13.6 13.6 4 4" stroke="#252d29" stroke-width="1.7" stroke-linecap="round"/></svg><span>搜索公司…</span></label><button class="fab" aria-label="新建"><svg width="22" height="22" viewBox="0 0 22 22"><path d="M11 3v16M3 11h16" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg></button></div>
      <div class="homebar"></div>
    </div>
  </div>
</div>

<script>
const CK='<svg width="11" height="9" viewBox="0 0 11 9"><path d="M1 4.6 4 7.5 10 1.5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
document.querySelectorAll('.prep .ck').forEach(b=>b.onclick=()=>b.closest('li').classList.toggle('done'));
</script>
<script src="mobile.js?v=6"></script>
</body>
</html>
