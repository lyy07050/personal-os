<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>my little os. · 所有部门</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="mobile.css?v=6">
<style>
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
.tile{border-radius:var(--r-card);padding:16px;min-height:148px;position:relative;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.tile:active{transform:scale(.98)}
.tile.wide{grid-column:1/-1;min-height:118px}
.tile.tall{min-height:200px}
.tile .no{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.02em}
.tile h2{font-size:20px;line-height:1.2;margin-top:auto}
.tile p{font-size:12.5px;color:var(--ink-2);margin-top:4px;line-height:1.45}
.tile p em{font-style:normal;color:var(--warn)}
.tile .big{font-size:34px;line-height:1;margin-top:10px}
.tile img{position:absolute;pointer-events:none;filter:drop-shadow(0 3px 5px rgba(46,42,39,.12))}
.arrow{position:absolute;right:14px;top:14px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.7);display:grid;place-items:center}
.lock{background:var(--apricot);display:flex;flex-direction:row;align-items:center;gap:14px;min-height:0}
.lock .ic{width:46px;height:46px;border-radius:16px;background:rgba(255,255,255,.7);display:grid;place-items:center;flex:none}
.lock h2{margin-top:0;font-size:17px}
.sec{margin:22px 4px 10px;font-size:13px;font-weight:500;color:var(--muted)}
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="screen">
      <div class="island"></div>
      <div class="scroll">
        <div class="status"><span>9:41</span><svg width="74" height="14" viewBox="0 0 74 14" aria-hidden="true"><g fill="#252d29"><rect x="0" y="9" width="3" height="5" rx="1"/><rect x="5" y="6" width="3" height="8" rx="1"/><rect x="10" y="3" width="3" height="11" rx="1"/><rect x="15" y="0" width="3" height="14" rx="1"/><path d="M32 3.5a10 10 0 0 1 13 0l-1.6 1.7a7.6 7.6 0 0 0-9.8 0zM34.6 6.3a6.2 6.2 0 0 1 7.8 0l-1.6 1.7a3.8 3.8 0 0 0-4.6 0zM38.5 12.5l-2-2.1a2.6 2.6 0 0 1 4 0z"/><rect x="50" y="1" width="21" height="12" rx="3.5" fill="none" stroke="#252d29" stroke-opacity=".4"/><rect x="52" y="3" width="17" height="8" rx="2"/></g></svg></div>

        <header class="navbar">
          <a class="round" href="mobile-home.html" aria-label="返回首页"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M11 3 5 9l6 6" fill="none" stroke="#252d29" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
          <div class="title"><h1 class="h">所有部门</h1></div>
        </header>

        <div class="tiles">
          <a class="tile wide" href="mobile-inbox.html" style="background:var(--m-blue)">
            <span class="no">00</span>
            <h2 class="h">随手记</h2>
            <p>11 条 · 还没整理 <em>4</em></p>
          </a>

          <a class="tile tall" href="mobile-review.html" style="background:#fff">
            <img src="assets/peony.png" alt="" style="right:-14px;top:-8px;width:96px">
            <span class="no">10</span>
            <h2 class="h">每周复盘</h2>
            <p>Week 47<br>上周完成度 71%</p>
          </a>
          <a class="tile tall" href="mobile-expense.html" style="background:var(--yellow)">
            <span class="no">20</span>
            <div class="big num">$812<span style="font-size:20px">.40</span></div>
            <h2 class="h">财务部</h2>
            <p>还剩 $587.60<br><em>2 笔待分类</em></p>
          </a>

          <a class="tile" href="mobile-fridge.html" style="background:#fff">
            <img src="assets/eggs.png" alt="" style="right:10px;top:12px;width:70px">
            <span class="no">30</span>
            <h2 class="h">食物墙</h2>
            <p>冷藏 6 样<br><em>牛奶明天过期</em></p>
          </a>
          <a class="tile" href="mobile-things.html" style="background:var(--blue)">
            <span class="no">31</span>
            <h2 class="h">物品墙</h2>
            <p>42 件 · 2 件保修快到期</p>
          </a>

          <a class="tile" href="mobile-notes.html" style="background:var(--beige)">
            <span class="no">40</span>
            <h2 class="h">知识库</h2>
            <p>38 张 · 今天复习 <em>6</em></p>
          </a>
          <a class="tile" href="mobile-english.html" style="background:var(--tint)">
            <img src="assets/notepaper.png" alt="" style="right:-30px;top:-26px;width:92px;transform:rotate(10deg);opacity:.9">
            <span class="no">41</span>
            <h2 class="h">多邻国</h2>
            <p>连续 23 天<br>今天 12 / 20</p>
          </a>

          <a class="tile" href="mobile-school.html" style="background:var(--purple)">
            <span class="no">45</span>
            <h2 class="h">教务处</h2>
            <p>本周 3 个截止<br><em>作业 4 今晚</em></p>
          </a>
          <a class="tile" href="mobile-career.html" style="background:var(--pink)">
            <img src="assets/butterfly.png" alt="" style="right:-22px;top:-20px;width:96px">
            <span class="no">50</span>
            <h2 class="h">人事部</h2>
            <p>面试中 2<br>周五 15:00</p>
          </a>
        </div>

        <div class="sec">加密</div>
        <a class="tile wide lock" href="mobile-private.html">
          <span class="ic" aria-hidden="true"><svg width="20" height="22" viewBox="0 0 20 22"><rect x="2.5" y="9" width="15" height="11" rx="3" fill="none" stroke="#4f5c52" stroke-width="1.7"/><path d="M6 9V6.5a4 4 0 0 1 8 0V9" fill="none" stroke="#4f5c52" stroke-width="1.7"/></svg></span>
          <div><h2 class="h">个人档案</h2></div>
        </a>
      </div>

      <div class="dock">
        <label class="search"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6.2" fill="none" stroke="#252d29" stroke-width="1.7"/><path d="m13.6 13.6 4 4" stroke="#252d29" stroke-width="1.7" stroke-linecap="round"/></svg><span>找部门、找笔记…</span></label>
        <a class="fab" href="#" aria-label="新建"><svg width="22" height="22" viewBox="0 0 22 22"><path d="M11 3v16M3 11h16" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg></a>
      </div>
      <div class="homebar"></div>
    </div>
  </div>
</div>
<script src="mobile.js?v=6"></script>
</body>
</html>
