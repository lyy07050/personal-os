.plan{margin-bottom:12px}
.three{list-style:none;display:flex;flex-direction:column;gap:8px}
.three li{display:flex;align-items:center;gap:12px;background:var(--tint);border-radius:14px;padding:6px 14px;border:1px solid rgba(37,45,41,.06);position:relative}
.three .n{font-weight:600;color:var(--green);width:14px}
.three input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:15px;outline:none;min-height:34px;caret-color:var(--green)}
.three li:focus-within{border-color:var(--green)}
.three li::before{content:"";position:absolute;left:-8px;top:50%;width:34px;height:14px;translate:0 -50%;rotate:-8deg;scale:0;opacity:.85;background:#f8dcd8;border-radius:2px;transition:scale .35s cubic-bezier(.2,.8,.2,1)}
.three.pinned li::before{scale:1}.three.pinned li:nth-child(2)::before{transition-delay:.12s;background-color:#fef0c4}.three.pinned li:nth-child(3)::before{transition-delay:.24s;background-color:#dfe8db}
.save{width:100%;height:48px;border-radius:999px;background:var(--green);color:#fff;font-size:15px;font-weight:600;margin-top:12px}
.save:disabled{opacity:.55}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);margin-bottom:12px}
.st{padding:14px 16px;text-align:center}
.label2{display:block;font-size:13px;color:var(--ink-2)}
.st .num{display:block;font-size:34px;line-height:1.15;color:var(--green)}
.st .num small{font-size:16px;color:var(--ink-2)}
.hr{display:grid;grid-template-columns:44px repeat(7,1fr);align-items:center;padding:3px 0}
.hr.head .d{font-size:12px;color:var(--muted);text-align:center}
.hn{font-size:13.5px}
.dot{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--outline);background:#f6f8f4;display:grid;place-items:center;margin:0 auto}
.dot svg{opacity:0}.dot.on{background:var(--green);border-color:var(--green)}.dot.on svg{opacity:1}
.strip{display:flex;height:36px;border-radius:10px;overflow:hidden;gap:3px}
.strip span{display:flex;align-items:center;padding:0 8px;font-size:12.5px;color:#303a33;min-width:0;overflow:hidden;white-space:nowrap}
</style>
