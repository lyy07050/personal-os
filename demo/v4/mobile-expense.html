<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>my little os. · 记一笔</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=DM+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="mobile.css?v=6">
<style>
.amount{padding:18px 18px 16px;margin-bottom:var(--gap)}
.amount .row{display:flex;align-items:baseline;gap:4px;min-height:64px}
.amount .cur{font-size:30px;font-weight:600;color:var(--muted)}
.amount .val{font-size:56px;line-height:1.1;color:var(--ink)}
.amount .val.zero{color:#848e85}
.caret{width:2px;height:46px;background:var(--green);align-self:center;margin-left:2px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pay{display:flex;gap:6px;margin-top:12px}
.pay button{height:36px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:500;background:var(--tint);color:var(--ink-2);border:1px solid rgba(37,45,41,.06)}
.pay button[aria-pressed="true"]{background:var(--sage);color:var(--green);border-color:transparent}
.meta{display:flex;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid rgba(37,45,41,.08);font-size:13px;color:var(--ink-2)}
.meta input{border:0;background:none;font:inherit;color:var(--ink);width:70%;outline:none}
.meta input::placeholder{color:var(--muted)}

.cats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:var(--gap)}
.cat{min-width:0;height:70px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:13px;font-weight:500;color:var(--ink);border:2px solid transparent;transition:border-color .2s,transform .2s}
.cat i{width:10px;height:10px;border-radius:50%;background:currentColor;opacity:.35}
.cat[aria-pressed="true"]{border-color:var(--green)}
.cat[aria-pressed="true"] i{background:var(--green);opacity:1}
.cat:active{transform:scale(.96)}

.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.pad button{height:54px;border-radius:18px;background:#fff;font-size:22px;font-weight:500;box-shadow:0 1px 2px rgba(52,72,59,.05);font-variant-numeric:tabular-nums;transition:background .15s}
.pad button:active{background:var(--sage)}
.save{width:100%;height:56px;border-radius:999px;background:var(--green-deep);color:#fff;font-size:16px;font-weight:600;box-shadow:0 10px 24px rgba(47,70,57,.3);margin-bottom:22px;transition:opacity .2s}
.save:disabled{opacity:.4}

.today ul{list-style:none}
.today li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 0;font-size:14px;border-bottom:1px solid rgba(37,45,41,.06)}
.today li:last-child{border-bottom:0}
.today li small{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.today .amt{font-family:"DM Mono",monospace;font-size:14px}
.today li.new{animation:in .5s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(-6px)}}

.toast{position:absolute;left:50%;bottom:40px;width:220px;transform:translate(-50%,24px);background:#fff;color:var(--ink);font-size:14px;font-weight:500;text-align:center;padding:14px 16px 18px;opacity:0;z-index:9;pointer-events:none;
  box-shadow:0 10px 24px rgba(37,45,41,.16);transition:opacity .25s,transform .45s cubic-bezier(.2,.8,.2,1);
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat,radial-gradient(circle 6px at 7px 100%,transparent 98%,#000) bottom left/14px 8px repeat-x;
  mask:linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat,radial-gradient(circle 6px at 7px 100%,transparent 98%,#000) bottom left/14px 8px repeat-x}
.toast::before{content:"";display:block;height:0;border-top:1.5px dashed rgba(37,45,41,.15);margin:-4px 0 10px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.meta .when{height:30px;padding:0 12px;border-radius:15px;background:var(--tint);border:1px solid rgba(37,45,41,.08);font-size:13px;color:var(--ink-2)}
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="screen">
      <div class="island"></div>
      <div class="toast" id="toast" role="status"></div>
      <div class="scroll" style="padding-bottom:40px">
        <div class="status"><span>9:41</span><svg width="74" height="14" viewBox="0 0 74 14" aria-hidden="true"><g fill="#252d29"><rect x="0" y="9" width="3" height="5" rx="1"/><rect x="5" y="6" width="3" height="8" rx="1"/><rect x="10" y="3" width="3" height="11" rx="1"/><rect x="15" y="0" width="3" height="14" rx="1"/><path d="M32 3.5a10 10 0 0 1 13 0l-1.6 1.7a7.6 7.6 0 0 0-9.8 0zM34.6 6.3a6.2 6.2 0 0 1 7.8 0l-1.6 1.7a3.8 3.8 0 0 0-4.6 0zM38.5 12.5l-2-2.1a2.6 2.6 0 0 1 4 0z"/><rect x="50" y="1" width="21" height="12" rx="3.5" fill="none" stroke="#252d29" stroke-opacity=".4"/><rect x="52" y="3" width="17" height="8" rx="2"/></g></svg></div>

        <header class="navbar">
          <a class="round" href="mobile-home.html" aria-label="返回首页"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M11 3 5 9l6 6" fill="none" stroke="#252d29" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
          <div class="title"><h1 class="h">记一笔</h1><p>本周已花 $214.50 · 预算还剩 $135.50</p></div>
        </header>

        <section class="card amount" aria-label="金额">
          <div class="row"><span class="cur">$</span><span class="val num zero" id="val">0</span><span class="caret"></span></div>
          <div class="pay" role="group" aria-label="付款方式">
            <button aria-pressed="false">Apple Pay</button>
            <button aria-pressed="true">现金</button>
            <button aria-pressed="false">信用卡</button>
          </div>
          <div class="meta"><input placeholder="备注" aria-label="备注"><button class="when">今天 11.18</button></div>
        </section>

        <div class="cats" role="group" aria-label="分类">
          <button class="cat" style="background:var(--pink);color:#c98f8c" aria-pressed="true"><i></i><span style="color:var(--ink)">餐饮</span></button>
          <button class="cat" style="background:var(--sage);color:#7f8f6e" aria-pressed="false"><i></i><span style="color:var(--ink)">交通</span></button>
          <button class="cat" style="background:var(--blue);color:#7aa6c2" aria-pressed="false"><i></i><span style="color:var(--ink)">购物</span></button>
          <button class="cat" style="background:var(--yellow);color:#c9a64a" aria-pressed="false"><i></i><span style="color:var(--ink)">日用</span></button>
          <button class="cat" style="background:var(--purple);color:#9a87a6" aria-pressed="false"><i></i><span style="color:var(--ink)">学习</span></button>
        </div>

        <div class="pad" id="pad">
          <button>1</button><button>2</button><button>3</button>
          <button>4</button><button>5</button><button>6</button>
          <button>7</button><button>8</button><button>9</button>
          <button>.</button><button>0</button><button aria-label="删除"><svg width="22" height="16" viewBox="0 0 22 16" aria-hidden="true"><path d="M7 1h13a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H7L1 8z" fill="none" stroke="#252d29" stroke-width="1.6" stroke-linejoin="round"/><path d="m11 5 6 6m0-6-6 6" stroke="#252d29" stroke-width="1.6" stroke-linecap="round"/></svg></button>
        </div>
        <button class="save" id="save" disabled>记好了</button>

        <section class="card today" aria-label="今天的账单">
          <div class="label"><span>今天 <span class="count" id="cnt">2</span> 笔</span></div>
          <ul id="list">
            <li><div>奶茶<small>餐饮 · Apple Pay</small></div><span></span><span class="amt">$6.50</span></li>
            <li><div>SQ *KOBO STORE<small>猜是：学习 · Apple Pay</small></div><span class="chip warn">待分类</span><span class="amt">$14.99</span></li>
          </ul>
        </section>
      </div>
      <div class="homebar"></div>
    </div>
  </div>
</div>
<script>
let v='';
const val=document.getElementById('val'),save=document.getElementById('save');
function render(){val.textContent=v||'0';val.classList.toggle('zero',!v);save.disabled=!(parseFloat(v)>0);}
document.getElementById('pad').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const k=b.textContent.trim();
  if(b.getAttribute('aria-label')==='删除'){v=v.slice(0,-1);}
  else if(k==='.'){if(!v.includes('.'))v=(v||'0')+'.';}
  else{if(v.includes('.')&&v.split('.')[1].length>=2)return;if(v==='0')v='';if(v.replace('.','').length<7)v+=k;}
  render();
});
function single(sel){document.querySelectorAll(sel).forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll(sel).forEach(x=>x.setAttribute('aria-pressed',x===b))}));}
single('.cat');single('.pay button');
save.addEventListener('click',()=>{
  const amt=parseFloat(v).toFixed(2),cat=document.querySelector('.cat[aria-pressed=true] span').textContent,pay=document.querySelector('.pay [aria-pressed=true]').textContent,note=document.querySelector('.meta input').value.trim();
  const li=document.createElement('li');li.className='new';
  li.innerHTML=`<div>${note?note.replace(/</g,'&lt;'):cat}<small>${cat} · ${pay}</small></div><span></span><span class="amt">$${amt}</span>`;
  document.getElementById('list').prepend(li);document.getElementById('cnt').textContent=document.querySelectorAll('#list li').length;
  const t=document.getElementById('toast');t.textContent=`已记下 $${amt} · ${cat}`;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);
  v='';document.querySelector('.meta input').value='';render();
});
</script>
</body>
</html>
