<style>
:root{--page:#f0f5f2;--ink:#252d29;--ink-2:#4f5c52;--muted:#5b645c}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--page);color:var(--ink);font-family:"Noto Sans SC",sans-serif;-webkit-font-smoothing:antialiased;padding:40px 32px 60px}
header{max-width:1720px;margin:0 auto 28px;display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.brand{font-family:"Gaegu",cursive;font-weight:700;font-size:32px}
.brand b{color:#a66b53}
header p{color:var(--ink-2);font-size:14px}
.row{display:flex;gap:28px;justify-content:center;flex-wrap:wrap}
figure{display:flex;flex-direction:column;gap:12px;align-items:center}
.frame{width:412px;height:866px;border-radius:58px;background:#111;padding:11px;box-shadow:0 30px 70px rgba(37,45,41,.18)}
iframe{width:390px;height:844px;border:0;border-radius:46px;display:block;background:#ebf2ed}
figcaption{font-size:14px;color:var(--ink-2)}
figcaption a{color:inherit}
.desk{max-width:1720px;margin:0 auto 36px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.desk b{font-weight:600;margin-right:8px}
.desk a{height:38px;padding:0 16px;border-radius:999px;background:#fff;display:inline-flex;align-items:center;font-size:14px;color:var(--ink);text-decoration:none;box-shadow:0 1px 2px rgba(52,72,59,.05),0 4px 12px rgba(52,72,59,.08)}
.desk a:hover{background:#dfe8db}
.mob{max-width:1720px;margin:0 auto 16px;font-size:16px;font-weight:600}
@media (max-width:440px){body{padding:20px 0}.frame{transform:scale(.9);transform-origin:top center}}
</style>
</head>
