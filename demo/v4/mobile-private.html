<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>my little os. · 个人档案</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="mobile.css?v=6">
<style>
.lockscreen{display:flex;flex-direction:column;align-items:center;padding-top:30px}
.lockscreen[hidden]{display:none}
.padlock{width:72px;height:72px;border-radius:24px;background:#fff;box-shadow:var(--shadow);display:grid;place-items:center}
.padlock.sm{width:40px;height:40px;border-radius:14px;box-shadow:none;background:rgba(255,255,255,.7)}
.lockscreen h2{font-size:20px;margin:18px 0 14px}
.pins{display:flex;gap:14px;margin-bottom:28px}
.pins i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--green);transition:background .15s}
.pins i.on{background:var(--green)}
.pins.shake{animation:shake .4s}
@keyframes shake{20%,60%{translate:-8px 0}40%,80%{translate:8px 0}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px 26px}
.pad button{width:76px;height:76px;border-radius:50%;background:#fff;font-size:28px;font-weight:500;box-shadow:0 1px 2px rgba(52,72,59,.05);display:grid;place-items:center}
.pad button:active{background:var(--sage)}
.pad .face,.pad .del{background:none;box-shadow:none}
.vault{display:flex;flex-direction:column;gap:12px}
.vault[hidden]{display:none}
.kv{list-style:none}
.kv li{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(37,45,41,.06);font-size:14.5px}
.kv li:last-child{border-bottom:0}
.kv span{color:var(--ink-2)}
.kv b{font-weight:500}
.second{display:flex;align-items:center;gap:12px;background:var(--apricot)}
.second b{flex:1;font-size:16px;font-weight:600}
.relock{height:34px;padding:0 12px;border-radius:999px;background:#fff;font-size:13px;color:var(--ink-2)}
.lockbtn{height:48px;border-radius:999px;background:#fff;box-shadow:var(--shadow);font-size:15px;font-weight:500}
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="screen">
      <div class="island"></div>
      <div class="scroll">
        <div class="status"><span>9:41</span><svg width="74" height="14" viewBox="0 0 74 14" aria-hidden="true"><g fill="#252d29"><rect x="0" y="9" width="3" height="5" rx="1"/><rect x="5" y="6" width="3" height="8" rx="1"/><rect x="10" y="3" width="3" height="11" rx="1"/><rect x="15" y="0" width="3" height="14" rx="1"/><path d="M32 3.5a10 10 0 0 1 13 0l-1.6 1.7a7.6 7.6 0 0 0-9.8 0zM34.6 6.3a6.2 6.2 0 0 1 7.8 0l-1.6 1.7a3.8 3.8 0 0 0-4.6 0zM38.5 12.5l-2-2.1a2.6 2.6 0 0 1 4 0z"/><rect x="50" y="1" width="21" height="12" rx="3.5" fill="none" stroke="#252d29" stroke-opacity=".4"/><rect x="52" y="3" width="17" height="8" rx="2"/></g></svg></div>
        <header class="navbar"><a class="round" href="mobile-more.html" aria-label="返回所有部门"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M11 3 5 9l6 6" fill="none" stroke="#252d29" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></a><div class="title"><h1 class="h">个人档案</h1></div></header>

        <section class="lockscreen" id="lock" aria-label="输入密码">
          <h2 class="h" style="margin-top:40px">输入密码</h2>
          <div class="pins" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <div class="pad" id="pad">
            <button>1</button><button>2</button><button>3</button><button>4</button><button>5</button><button>6</button><button>7</button><button>8</button><button>9</button>
            <span></span><button>0</button><button class="del" aria-label="删除"><svg width="22" height="16" viewBox="0 0 22 16" aria-hidden="true"><path d="M7 1h13a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H7L1 8z" fill="none" stroke="#252d29" stroke-width="1.6" stroke-linejoin="round"/><path d="m11 5 6 6m0-6-6 6" stroke="#252d29" stroke-width="1.6" stroke-linecap="round"/></svg></button>
          </div>
        </section>
        <div class="vault" id="vault" hidden>
          <section class="card" aria-label="身体数据"><div class="label"><span>身体数据</span></div><ul class="kv"><li><span>体重</span><b>52 kg</b></li><li><span>上次体检</span><b>2026.06</b></li><li><span>生理期</span><b>下次约 11.28</b></li></ul></section>
          <section class="card" aria-label="尺码"><div class="label"><span>尺码</span></div><ul class="kv"><li><span>上衣</span><b>S</b></li><li><span>鞋</span><b>37</b></li><li><span>戒指</span><b>11 号</b></li></ul></section>
          <section class="card second" aria-label="账号密码"><span class="padlock sm" aria-hidden="true"><svg width="18" height="20" viewBox="0 0 20 22"><rect x="2.5" y="9" width="15" height="11" rx="3" fill="none" stroke="#3e5b4b" stroke-width="1.6"/><path d="M6 9V6.5a4 4 0 0 1 8 0V9" fill="none" stroke="#3e5b4b" stroke-width="1.6"/></svg></span><b>账号密码</b><button class="relock">需要第二个密码</button></section>
          <button class="lockbtn" id="relock">锁上</button>
        </div>
      </div>
      
      <div class="homebar"></div>
    </div>
  </div>
</div>

<script>
const CK='<svg width="11" height="9" viewBox="0 0 11 9"><path d="M1 4.6 4 7.5 10 1.5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
// 演示：任意 6 位数字都能解锁；真实版本用 Meld Encrypt 的密码解开本机上的加密副本
let code='';const pins=[...document.querySelectorAll('.pins i')];
function draw(){pins.forEach((p,i)=>p.classList.toggle('on',i<code.length));}
function open(){document.getElementById('lock').hidden=true;document.getElementById('vault').hidden=false;}
document.getElementById('pad').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.classList.contains('del')){code=code.slice(0,-1);draw();return;}
  if(code.length<6){code+=b.textContent.trim();draw();}
  if(code.length===6)setTimeout(()=>{open();code='';draw();},180);});
document.getElementById('relock').onclick=()=>{document.getElementById('vault').hidden=true;document.getElementById('lock').hidden=false;};
// 离开页面就重新锁上
document.addEventListener('visibilitychange',()=>{if(document.hidden)document.getElementById('relock').click();});
</script>
<script src="mobile.js?v=6"></script>
</body>
</html>
